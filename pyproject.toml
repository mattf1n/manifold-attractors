[project]
name = "manifold-attractors"
version = "0.1.0"
description = "Standalone regeneration of the manifold-attractors paper figures"
readme = "README.md"
requires-python = ">=3.13,<3.14"
dependencies = ["pillow==12.3.0", "pypdf==6.19.0"]

[project.optional-dependencies]
compute = [
  "numpy==2.2.6",
  "torch==2.11.0",
  "transformers==5.8.0",
  "accelerate>=1.0",
  "huggingface-hub>=1.0",
  "pyarrow==24.0.0",
  "pandas==3.0.3",
  "scipy==1.18.1",
  "datasets>=4",
]
render = ["numpy==2.2.6", "matplotlib==3.10.9"]
render-bubble = [
  "numpy==2.5.3", "matplotlib==3.11.2", "pandas==3.0.6",
  "pyarrow==25.0.1", "scipy==1.18.1",
]

[project.scripts]
reproduce = "manifold_attractors.pipeline:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/manifold_attractors"]

[tool.uv]
conflicts = [
  [{extra = "compute"}, {extra = "render-bubble"}],
  [{extra = "render"}, {extra = "render-bubble"}],
]

[dependency-groups]
dev = ["pytest>=8"]

[tool.pytest.ini_options]
testpaths = ["tests"]
